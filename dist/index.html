<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life of an Evermean: Cosmic Ascension</title>
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ca8a04">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Evermean 3D">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b19;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #app {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
  </style>

  <!-- Global Error Handler -->
  <script>
    window.addEventListener('error', function (e) {
      console.error('Captured Error:', e);
      var box = document.getElementById('debug-error-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-error-box';
        box.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#380b0b;color:#fca5a5;padding:16px;border:2px solid #ef4444;border-radius:8px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 8px 30px rgba(0,0,0,0.9);';
        document.body.appendChild(box);
      }
      box.textContent = '⚠️ Runtime Error: ' + e.message + '\nFile: ' + e.filename + ':' + e.lineno + '\n' + (e.error ? (e.error.stack || '') : '');
    });

    window.addEventListener('unhandledrejection', function (e) {
      console.error('Unhandled Promise:', e);
      var box = document.getElementById('debug-error-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-error-box';
        box.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#380b0b;color:#fca5a5;padding:16px;border:2px solid #ef4444;border-radius:8px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 8px 30px rgba(0,0,0,0.9);';
        document.body.appendChild(box);
      }
      box.textContent = '⚠️ Unhandled Rejection: ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown') + '\n' + (e.reason && e.reason.stack ? e.reason.stack : '');
    });
  </script>
  <script type="module" crossorigin src="./assets/index-CfoYVVnJ.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Service Worker Registration & PWA Prompt Capture -->
  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      const installBtn = document.getElementById('btn-install-pwa');
      if (installBtn) {
        installBtn.style.display = 'flex';
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Evermean PWA ServiceWorker registered with scope:', reg.scope);
          })
          .catch((err) => {
            console.warn('Evermean PWA ServiceWorker registration failed:', err);
          });
      });
    }
  </script>

</body>
</html>
