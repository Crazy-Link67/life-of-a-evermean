<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life of an Evermean: Cosmic Ascension</title>
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ca8a04">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Evermean 3D">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b19;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #app {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-u7NlKUea.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Service Worker Registration & PWA Prompt Capture -->
  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      const installBtn = document.getElementById('btn-install-pwa');
      if (installBtn) {
        installBtn.style.display = 'flex';
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('Evermean PWA ServiceWorker registered with scope:', reg.scope);
          })
          .catch((err) => {
            console.warn('Evermean PWA ServiceWorker registration failed:', err);
          });
      });
    }
  </script>

</body>
</html>
