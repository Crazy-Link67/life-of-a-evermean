<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cosmic background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1435"/>
      <stop offset="60%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    
    <!-- Gnarled wood trunk gradient -->
    <linearGradient id="barkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b4c35"/>
      <stop offset="50%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#2a1d15"/>
    </linearGradient>

    <!-- Glowing cosmic foliage gradient -->
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Starlight Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="6"/>

  <!-- Stars in background -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="90" cy="110" r="3"/>
    <circle cx="140" cy="70" r="2"/>
    <circle cx="390" cy="130" r="3.5" filter="url(#glow)"/>
    <circle cx="430" cy="85" r="2.5"/>
    <circle cx="70" cy="280" r="2"/>
    <circle cx="440" cy="270" r="3"/>
    <circle cx="180" cy="130" r="2"/>
    <circle cx="340" cy="80" r="2"/>
  </g>

  <!-- Pointy Root Legs (Authentic TOTK Up-rooted tree legs) -->
  <g stroke="url(#barkGrad)" stroke-linecap="round" fill="none">
    <!-- Center Left Pointy Root -->
    <path d="M 235 340 Q 200 400 160 465" stroke-width="22"/>
    <path d="M 160 465 L 150 485" stroke-width="10"/>

    <!-- Far Left Pointy Root -->
    <path d="M 215 330 Q 140 380 95 440" stroke-width="18"/>
    <path d="M 95 440 L 85 455" stroke-width="8"/>

    <!-- Center Right Pointy Root -->
    <path d="M 275 340 Q 310 400 350 465" stroke-width="22"/>
    <path d="M 350 465 L 360 485" stroke-width="10"/>

    <!-- Far Right Pointy Root -->
    <path d="M 295 330 Q 370 380 415 440" stroke-width="18"/>
    <path d="M 415 440 L 425 455" stroke-width="8"/>
  </g>

  <!-- Gnarled Wooden Tree Trunk (Evermean Body) -->
  <path d="M 210 340 C 205 280, 220 220, 215 170 L 297 170 C 292 220, 307 280, 302 340 Z" fill="url(#barkGrad)" stroke="#1a110b" stroke-width="4"/>

  <!-- Wood knots and bark ridges -->
  <g stroke="#26170d" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 235 210 Q 255 220 245 240"/>
    <path d="M 275 250 Q 260 270 270 290"/>
    <path d="M 240 285 Q 250 295 245 315"/>
  </g>

  <!-- Glowing Vein of Cosmic / Lightning Sap in the wood -->
  <path d="M 256 180 Q 248 230 258 270 T 252 335" fill="none" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>

  <!-- Praying Mantis / Branch Scythe Limbs -->
  <g stroke="url(#barkGrad)" stroke-linecap="round" fill="none">
    <!-- Left Scythe Branch -->
    <path d="M 215 190 Q 150 170 120 220 Q 110 250 140 280" stroke-width="16"/>
    <!-- Right Scythe Branch -->
    <path d="M 297 190 Q 362 170 392 220 Q 402 250 372 280" stroke-width="16"/>
  </g>

  <!-- Tree Stump Head (Flat TOTK cut stump with growth rings) -->
  <ellipse cx="256" cy="170" rx="42" ry="14" fill="#7a553c" stroke="#2a1a0f" stroke-width="4"/>
  <ellipse cx="256" cy="170" rx="28" ry="9" fill="none" stroke="#4a3324" stroke-width="2"/>
  <ellipse cx="256" cy="170" rx="14" ry="4" fill="none" stroke="#4a3324" stroke-width="2"/>

  <!-- Cosmic / Lush Foliage Canopy (Swirling star clusters) -->
  <g filter="url(#glow)">
    <circle cx="210" cy="130" r="46" fill="url(#cosmicGrad)" opacity="0.9"/>
    <circle cx="302" cy="130" r="46" fill="url(#cosmicGrad)" opacity="0.9"/>
    <circle cx="256" cy="100" r="52" fill="url(#cosmicGrad)" opacity="0.95"/>
    <circle cx="165" cy="150" r="32" fill="url(#cosmicGrad)" opacity="0.8"/>
    <circle cx="347" cy="150" r="32" fill="url(#cosmicGrad)" opacity="0.8"/>
  </g>

  <!-- Glowing Cosmic Core Gem / Stardust Spark -->
  <polygon points="256,60 264,80 284,88 264,96 256,116 248,96 228,88 248,80" fill="#fef08a" filter="url(#glow)"/>
</svg>
